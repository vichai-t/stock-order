<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เช็กสต็อก / สั่งของ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fffbe6;--card:#fff;--tx:#222;--mut:#7a7360;--ac:#f76707;--bd:#f0e4b8;--on:#2f9e44;--yl:#fab005}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b14;--card:#2a2719;--tx:#eee;--mut:#a39d85;--ac:#ff922b;--bd:#443e22;--on:#51cf66;--yl:#fcc419}}
:root[data-theme="dark"]{--bg:#1d1b14;--card:#2a2719;--tx:#eee;--mut:#a39d85;--ac:#ff922b;--bd:#443e22;--on:#51cf66;--yl:#fcc419}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;padding:12px 14px calc(90px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto}
h1{font-size:20px;margin:8px 0 10px;padding:13px 16px;border-radius:14px;color:#fff;background:var(--ac)}
.info{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}.info span{flex:1}.info input,.lg input{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}.info button{border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:8px;padding:8px 10px;cursor:pointer}
.lg{display:flex;flex-direction:column;gap:10px;margin-top:20px}.lg input{padding:13px;font-size:16px}#err{color:#e03131;text-align:center;min-height:20px}
.cat:nth-child(1){border-left:6px solid #f76707}.cat:nth-child(2){border-left:6px solid #fab005}.cat:nth-child(3){border-left:6px solid #2f9e44}
input[type=search]{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.cats{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}
.cat{display:flex;align-items:center;gap:14px;padding:18px;background:var(--card);border:1px solid var(--bd);border-radius:14px;font-size:18px;cursor:pointer;color:var(--tx);text-align:left;width:100%}
.cat b{font-size:30px}.cat small{display:block;color:var(--mut);font-size:13px}
.back{background:none;border:0;color:var(--ac);font-size:16px;padding:6px 0;cursor:pointer}
.grp{font-size:13px;font-weight:700;color:var(--mut);margin:16px 0 6px;letter-spacing:.3px}
.it{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px}
.it.sel{border-color:var(--ac)}
.nm{flex:1;min-width:0;font-size:15px;line-height:1.3}.nm small{display:block;color:var(--mut);font-size:12px}
.tag{font-size:11px;color:var(--mut)}
.st{display:flex;align-items:center;gap:4px}
.st button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.st input{width:52px;height:34px;text-align:center;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.tg{padding:8px 16px;border-radius:20px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;cursor:pointer}
.tg.on{background:var(--on);color:#fff;border-color:var(--on)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bar button,.pri{display:block;width:100%;max-width:612px;margin:auto;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
.sec{background:var(--bg);color:var(--ac);border:1px solid var(--ac)!important;margin-top:8px}
textarea{width:100%;height:260px;margin:10px 0;padding:10px;font-size:14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
</style></head><body>
<div id="app"></div>
<script>
const CATS={fresh:['🥩','ของสด'],dry:['🥫','ของแห้ง'],front:['🍽️','ของหน้าบ้าน']};
const ITEMS=[];
function build(txt){ITEMS.length=0;let c='',g='';
 txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||l.startsWith('//'))return;
  const m=l.match(/^\[(fresh|dry|front)\]$/);if(m){c=m[1];g='';return}
  if(l[0]=='#'){g=l.slice(1).trim();return}
  if(!c)return;
  if(c=='front'){ITEMS.push({id:c+ITEMS.length,c,g:'',n:l,u:'',s:''});return}
  const[n,u,s]=l.split('|');ITEMS.push({id:c+ITEMS.length,c,g,n:n.trim(),u:(u||'').trim(),s:(s||'').trim()})})}
let sel={},view='home',q='',user='';
try{user=localStorage.getItem('stock-user')||''}catch(e){}
try{sel=JSON.parse(localStorage.getItem('stock-sel')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('stock-sel',JSON.stringify(sel))}catch(e){}};
const $=document.getElementById('app');
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const cnt=()=>Object.keys(sel).length;
function row(i){
 const v=sel[i.id],on=v!=null;
 const sub=[i.u,i.s?'ปกติ '+i.s:''].filter(Boolean).join(' · ');
 const ctl=i.c=='front'?`<button class="tg ${on?'on':''}" onclick="tgl('${i.id}')">${on?'✓ เอา':'ไม่เอา'}</button>`
 :`<div class="st"><button onclick="adj('${i.id}',-1)">−</button><input type="number" inputmode="decimal" min="0" value="${on?v:0}" onchange="setq('${i.id}',this.value)"><button onclick="adj('${i.id}',1)">+</button></div>`;
 return `<div class="it ${on?'sel':''}"><div class="nm">${esc(i.n)}<small>${esc(sub)}${q&&view=='home'?' · '+CATS[i.c][1]:''}</small></div>${ctl}</div>`}
function list(arr,grp){let h='',g=null;arr.forEach(i=>{if(grp&&i.g!==g){g=i.g;if(g)h+=`<div class="grp">${esc(g)}</div>`}h+=row(i)});return h||'<div class="empty">ไม่พบรายการ</div>'}
function render(){
 if(!user){$.innerHTML='<h1>👤 ใส่ชื่อเพื่อสั่งของ</h1><div class="lg"><input id="nm" placeholder="ชื่อ" value="Fat Boy"><button class="pri" onclick="login()">เริ่มสั่งของ</button><div id="err"></div></div>';return}
 if(!ready){$.innerHTML='<div class="empty">กำลังโหลดรายการ…</div>';return}
 const f=document.activeElement&&document.activeElement.id=='q';
 let h='';
 if(view=='sum'){
  const L=ITEMS.filter(i=>sel[i.id]!=null);
  const txt=`ผู้สั่ง: ${user}\nวันที่: ${fd()}\n\n`+['fresh','dry','front'].map(c=>{const a=L.filter(i=>i.c==c);return a.length?`【${CATS[c][1]}】\n`+a.map(i=>i.c=='front'?`- ${i.n}`:`- ${i.n} ${sel[i.id]}${U(i.u)}`).join('\n'):''}).filter(Boolean).join('\n\n');
  h=`<button class="back" onclick="go('home')">‹ กลับ</button><h1>สรุปรายการสั่ง (${L.length})</h1>`+info()+(L.length?`<textarea id="out" readonly>${esc(txt)}</textarea><button class="pri" id="cpb" onclick="cp()">คัดลอกรายการ</button><button class="pri sec" onclick="clr()">${cf?'กดอีกครั้งเพื่อยืนยันล้าง':'ล้างทั้งหมด'}</button>`:'<div class="empty">ยังไม่ได้เลือกรายการ</div>')+`<div class="bar"><button onclick="go('home')">‹ กลับหน้าแรก</button></div>`;
 }else{
  if(view!='home')h+=`<button class="back" onclick="go('home')">‹ หน้าแรก</button><h1>${CATS[view][0]} ${CATS[view][1]}</h1>`;else h+='<h1>📋 สั่งของ</h1>';
  h+=info()+`<input type="search" id="q" placeholder="ค้นหารายการ (ไทย/อังกฤษ)" value="${esc(q)}" oninput="q=this.value;render()">`;
  if(q.trim()){const k=q.trim().toLowerCase();h+=`<div class="grp">ผลการค้นหา</div>`+list(ITEMS.filter(i=>(view=='home'||i.c==view)&&i.n.toLowerCase().includes(k)),false)}
  else if(view=='home')h+='<div class="cats">'+Object.keys(CATS).map(c=>{const n=ITEMS.filter(i=>i.c==c&&sel[i.id]!=null).length;return `<button class="cat" onclick="go('${c}')"><b>${CATS[c][0]}</b><span>${CATS[c][1]}<small>${ITEMS.filter(i=>i.c==c).length} รายการ${n?' · เลือกแล้ว '+n:''}</small></span></button>`}).join('')+'</div>';
  else h+=list(ITEMS.filter(i=>i.c==view),true);
  if(cnt())h+=`<div class="bar"><button onclick="go('sum')">ดูสรุป (${cnt()} รายการ)</button></div>`;
 }
 $.innerHTML=h;
 if(f){const e=document.getElementById('q');e.focus();e.setSelectionRange(q.length,q.length)}
}
function go(v){view=v;q='';render();scrollTo(0,0)}
function tgl(id){sel[id]!=null?delete sel[id]:sel[id]=1;save();render()}
function setq(id,v){v=parseFloat(v);if(!(v>0))delete sel[id];else sel[id]=v;save();render()}
function adj(id,d){const v=Math.max(0,Math.round(((sel[id]||0)+d)*100)/100);setq(id,v)}
let cf=false;
const U=u=>{u=(u||'').replace(/\s+[\d.]+\s*(g|kg)$/i,'').trim();return u&&u!=='-'?' '+u:''};
function clr(){if(!cf){cf=true;render();setTimeout(()=>{if(cf){cf=false;if(view=='sum')render()}},4000)}else{sel={};save();cf=false;render()}}
function cp(){const t=document.getElementById('out'),b=document.getElementById('cpb');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
 const done=()=>{b.textContent='คัดลอกแล้ว ✓'};
 try{navigator.clipboard.writeText(t.value).then(done,()=>{ok?done():b.textContent='กดค้างที่ข้อความแล้วเลือกคัดลอก'})}catch(e){ok?done():b.textContent='กดค้างที่ข้อความแล้วเลือกคัดลอก'}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let dt=today();
const fd=()=>dt.split('-').reverse().join('/');
const info=()=>`<div class="info"><span>👤 ${esc(user)}</span><input type="date" value="${dt}" onchange="dt=this.value||today();if(view=='sum')render()"><button onclick="logout()">เปลี่ยนชื่อ</button></div>`;
function login(){const n=document.getElementById('nm').value.trim();
 if(!n){document.getElementById('err').textContent='กรุณาใส่ชื่อ';return}
 user=n;try{localStorage.setItem('stock-user',n)}catch(e){}render()}
function logout(){user='';view='home';try{localStorage.removeItem('stock-user')}catch(e){}render()}
let ready=false;
async function loadItems(){try{const r=await fetch('items.txt',{cache:'no-cache'});if(!r.ok)throw 0;build(await r.text());ready=true;render()}
 catch(e){$.innerHTML='<div class="empty">โหลดรายการไม่สำเร็จ<br>ต้องเปิดผ่านเว็บ (ไม่ใช่เปิดไฟล์ตรง ๆ) และมีไฟล์ items.txt อยู่ข้างกัน<br><br><button class="pri" onclick="loadItems()">ลองใหม่</button></div>'}}
render();loadItems();
</script></body></html>
